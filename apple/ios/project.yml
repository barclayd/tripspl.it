name: TripSplit
options:
  bundleIdPrefix: it.tripspl
  deploymentTarget:
    iOS: '26.0'
    watchOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: R2GGK3VN2C
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  TripSplitDomain:
    path: ../Packages/TripSplitDomain
  TripSplitInfrastructure:
    path: ../Packages/TripSplitInfrastructure
  TripSplitApplication:
    path: ../Packages/TripSplitApplication
  TripSplitFeatures:
    path: ../Packages/TripSplitFeatures
  TripSplitWatchFeatures:
    path: ../Packages/TripSplitWatchFeatures
targets:
  TripSplit:
    type: application
    platform: iOS
    sources:
      - path: TripSplit
        excludes: [AppIcon.icon]
      - path: TripSplit/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: TripSplitApplication
        product: TripSplitApplication
      - package: TripSplitInfrastructure
        product: TripSplitNetworking
      - package: TripSplitInfrastructure
        product: TripSplitPersistence
      - package: TripSplitInfrastructure
        product: TripSplitSync
      - package: TripSplitDomain
        product: TripSplitDomain
      - package: TripSplitFeatures
        product: TripSplitDesignSystem
      - package: TripSplitFeatures
        product: TripSplitTripsUI
      - package: TripSplitFeatures
        product: TripSplitExpensesUI
      - package: TripSplitFeatures
        product: TripSplitConversionUI
      - package: TripSplitFeatures
        product: TripSplitOnboardingUI
      - package: TripSplitFeatures
        product: TripSplitAccountUI
      - package: TripSplitFeatures
        product: TripSplitGlobeUI
      - package: TripSplitApplication
        product: TripSplitCompanionHost
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: TripSplit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [tripsplit]
        TripSplitAPIBaseURL: $(TRIPSPLIT_API_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSUserActivityTypes: [it.tripspl.TripSplit.new-trip]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tripspl.TripSplit
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: 6
        TRIPSPLIT_API_BASE_URL: https://api.tripspl.it
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/TripSplit.entitlements
  TripSplitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../Packages/TripSplitDomain/Tests/TripSplitDomainTests
      - path: ../Packages/TripSplitApplication/Tests/TripSplitApplicationTests
        excludes: [Fixtures]
      - path: ../Packages/TripSplitApplication/Tests/TripSplitApplicationTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: TripSplit
      - package: TripSplitApplication
        product: TripSplitApplication
      - package: TripSplitInfrastructure
        product: TripSplitNetworking
      - package: TripSplitInfrastructure
        product: TripSplitPersistence
      - package: TripSplitInfrastructure
        product: TripSplitSync
      - package: TripSplitDomain
        product: TripSplitDomain
      - package: TripSplitApplication
        product: TripSplitConversion
      - package: TripSplitInfrastructure
        product: TripSplitCompanion
      - package: TripSplitApplication
        product: TripSplitCompanionHost
      - package: TripSplitApplication
        product: TripSplitWatchModel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TripSplitWatch:
    type: application
    platform: watchOS
    sources: [../watch/TripSplitWatch, ../watch/Shared]
    dependencies:
      - package: TripSplitApplication
        product: TripSplitWatchModel
      - package: TripSplitWatchFeatures
        product: TripSplitWatchUI
      - target: TripSplitWatchWidgets
    info:
      path: ../watch/Config/Info.plist
      properties:
        CFBundleDisplayName: TripSplit
        CFBundleURLTypes:
          - CFBundleURLSchemes: [tripsplit]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: it.tripspl.TripSplit
        TripSplitAPIBaseURL: $(TRIPSPLIT_API_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tripspl.TripSplit.watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: 6
        TRIPSPLIT_API_BASE_URL: https://api.tripspl.it
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ../watch/Config/TripSplitWatch.entitlements
  TripSplitWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [../watch/TripSplitWatchWidgets, ../watch/Shared]
    dependencies:
      - package: TripSplitApplication
        product: TripSplitWatchModel
      - package: TripSplitWatchFeatures
        product: TripSplitWatchGlances
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: ../watch/Config/Widgets-Info.plist
      properties:
        CFBundleDisplayName: TripSplit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tripspl.TripSplit.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: '4'
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: 6
        CODE_SIGN_ENTITLEMENTS: ../watch/Config/TripSplitWatchWidgets.entitlements
        SKIP_INSTALL: YES
schemes:
  TripSplit:
    build:
      targets:
        TripSplit: all
        TripSplitTests: [test]
    test:
      targets: [TripSplitTests]
  TripSplitWatch:
    build:
      targets:
        TripSplitWatch: all
    run:
      commandLineArguments:
        --demo: false

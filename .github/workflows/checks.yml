name: checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install locked API dependencies
        working-directory: api
        run: bun install --frozen-lockfile
      - name: Check API types and generated contract
        working-directory: api
        run: bun run check
      - name: Validate destination catalogue
        run: python3 scripts/generate_destination_catalogue.py --check

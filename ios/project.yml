name: TripSplit
options:
  bundleIdPrefix: it.tripspl
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: R2GGK3VN2C
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  TripSplit:
    type: application
    platform: iOS
    sources: [TripSplit]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: TripSplit
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [tripsplit]
        TripSplitAPIBaseURL: $(TRIPSPLIT_API_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tripspl.TripSplit
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: 2
        TRIPSPLIT_API_BASE_URL: https://api.tripspl.it
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/TripSplit.entitlements
  TripSplitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TripSplitTests, DomainTests]
    dependencies:
      - target: TripSplit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TripSplit:
    build:
      targets:
        TripSplit: all
        TripSplitTests: [test]
    test:
      targets: [TripSplitTests]
